{# the tags X, LinkedIn, and WhatsApp read to draw a link's preview; the image is the event's photo when it has one (share_image), else the site's card #}
<meta property="og:site_name" content="{{ SITENAME }}">
<meta property="og:locale" content="es_ES">
<meta property="og:type" content="{{ share_type }}">
<meta property="og:title" content="{{ share_title }}">
<meta property="og:description" content="{{ share_description|striptags|trim }}">
<meta property="og:url" content="{{ share_url }}">
{% if share_image %}<meta property="og:image" content="{{ SITEURL }}/{{ share_image }}">
<meta property="og:image:alt" content="{{ share_image_alt }}">
{% else %}<meta property="og:image" content="{{ SITEURL }}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ OG_IMAGE_ALT }}">
{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{ X_HANDLE }}">
