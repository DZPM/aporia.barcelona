<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>{{ SITEURL }}/</loc></url>
{% for a in articles %}
  <url><loc>{{ SITEURL }}/{{ a.url }}</loc><lastmod>{{ (a.modified or a.date).strftime('%Y-%m-%d') }}</lastmod></url>
{% endfor %}
</urlset>
