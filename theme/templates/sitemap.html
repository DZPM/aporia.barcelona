<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>{{ SITEURL }}/</loc></url>
{% for a in articles if a.url %}
  <url><loc>{{ SITEURL }}/{{ a.url }}</loc>{% if a.modified %}<lastmod>{{ a.modified.strftime('%Y-%m-%d') }}</lastmod>{% endif %}</url>   {# lastmod only when the event says when it changed (Modified): the event date is not a change date #}
{% endfor %}
</urlset>
