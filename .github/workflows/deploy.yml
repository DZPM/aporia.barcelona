name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:          # a pull request is built and checked; it never deploys
    branches: [main]
  workflow_dispatch:

permissions: {}   # each job asks for what it needs: the build runs third-party packages and must not hold the deploy rights

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:          # one group per branch or pull request: a newer push replaces an older build of the same ref only
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # no token in .git/config for the steps that follow
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true           # keyed by uv.lock
          activate-environment: true   # .venv/bin on PATH for the steps that follow
      - run: uv sync --locked   # every package as uv.lock pins it, with the hash of its files; fails if the lock is stale
      - run: ruff check
      - run: pelican content -o output -s publishconf.py --fatal warnings
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: output

  workflows:   # the workflow files themselves: expressions and the shell in each run step (ShellCheck ships with the runner image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - env:   # a pinned release, checked against its published checksum; Dependabot does not update these two lines
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  deploy:
    needs: [build, workflows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:          # only deploys share this group, so a pull request cannot cancel or hold one; a started deploy runs to the end
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
